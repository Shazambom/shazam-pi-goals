[package]
name = "shazam-pi-goals-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
